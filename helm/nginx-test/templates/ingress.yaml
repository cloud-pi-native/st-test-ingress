apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nginx-test.fullname" . }}
  labels:
    exposition: rie
spec:
  rules:
    - host: {{ .Value.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "nginx-test.fullname" $ }}
                port:
                  number: {{ $.Values.service.port }}
